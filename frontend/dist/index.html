<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063c32"><title>SUDAMERIS · esta vez, funcional.</title><link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="glass.css?v=3"><script src="vue.global.prod.js"></script><script src="qrcode.js"></script></head><body><div id="app" v-cloak>
<aside class="brand-panel"><div class="brand-halo halo-one"></div><div class="brand-halo halo-two"></div><a class="brand-signature" href="#" @click.prevent="go('inicio')"><strong>SUDAMERIS</strong><span>esta vez, funcional.</span></a><div class="glass-art" aria-hidden="true"><div class="art-pane pane-one"></div><div class="art-pane pane-two"></div><div class="art-pane pane-three"></div></div></aside>
<main class="app-shell">
<template v-if="!logged"><div class="auth"><div class="auth-brand"><strong>SUDAMERIS</strong><span>esta vez, funcional.</span></div><h2>{{auth==='login'?'Iniciar sesión':auth==='recover'?'Recuperar acceso':'Crear cuenta'}}</h2><form @submit.prevent="authenticate"><template v-if="auth==='register'"><label>Nombre y apellido<input v-model="registration.name" required placeholder="¿Cómo te llamás?"></label><div class="row"><label>País del documento<select><option>Paraguay</option><option>Argentina</option><option>Brasil</option></select></label><label>Tipo<select><option>Cédula</option></select></label></div><label>Número de documento<input v-model="registration.document" required inputmode="numeric" pattern="[0-9]{5,12}" placeholder="Ej. 4567890"></label><label>Tipo de cuenta<select v-model="registration.type"><option>Caja de ahorro</option><option>Cuenta corriente</option></select></label></template><label>{{auth==='recover'?'Correo electrónico':'Usuario o documento'}}<input v-model="credentials.user" :type="auth==='recover'?'email':'text'" required :placeholder="auth==='recover'?'nombre@correo.com':'Tu usuario'" autocomplete="username"></label><template v-if="auth!=='recover'"><label>Contraseña<div class="password"><input :type="showPassword?'text':'password'" v-model="credentials.password" required minlength="4" placeholder="Ingresá tu contraseña" autocomplete="current-password"><button type="button" @click="showPassword=!showPassword">{{showPassword?'Ocultar':'Ver'}}</button></div></label><label v-if="auth==='register'">Repetir contraseña<input type="password" v-model="registration.confirm" required minlength="4"></label><button v-if="auth==='login'" type="button" class="text-link align-right" @click="auth='recover'">Olvidé mi contraseña</button><label v-if="auth==='register'" class="check"><input type="checkbox" required> Acepto las condiciones de uso.</label></template><p class="error" v-if="authError">{{authError}}</p><button class="primary full" :disabled="busy">{{auth==='login'?'Iniciar sesión':auth==='recover'?'Solicitar recuperación':'Crear cuenta'}} <span>↗</span></button></form><p class="auth-bottom">{{auth==='login'?'¿Todavía no tenés cuenta?':'¿Ya tenés cuenta?'}} <button class="text-link" @click="auth=auth==='login'?'register':'login';authError=''">{{auth==='login'?'Creala aquí':'Iniciar sesión'}}</button></p></div></template>
<template v-else><header class="topbar"><button class="header-brand" @click="go('inicio')"><strong>SUDAMERIS</strong><span>esta vez, funcional.</span></button><button class="icon-button notification-button" aria-label="Notificaciones" @click="go('notificaciones')"><icon name="bell"></icon><i v-if="unread"></i></button></header>
<div class="page" :class="{'home-page':page==='inicio'}" :key="page"><template v-if="page==='inicio'"><section class="balance-card"><div class="balance-label">Saldo disponible <button @click="balanceVisible=!balanceVisible" aria-label="Mostrar u ocultar saldo"><icon name="eye"></icon></button></div><div class="balance">{{balanceVisible?money(account.balance):'••••••'}} <small v-if="balanceVisible">Gs.</small></div><button class="account-select" @click="modal='accounts'">Cuenta N.º {{account.number}} <span>⌄</span></button><div class="balance-bottom"><span :class="{inactive:account.status!=='Activa'}">{{account.type}} · {{account.status}}</span></div></section>
<div class="quick-actions"><button @click="go('recibir')"><span><icon name="receive"></icon></span>Recibir dinero</button><button @click="startTransfer"><span><icon name="send"></icon></span>Enviar dinero</button><button @click="go('opciones')"><span><icon name="plus"></icon></span>Más opciones</button></div>
<section class="accounts-surface"><div class="tabs"><button :class="{active:homeTab==='cuentas'}" @click="homeTab='cuentas'">Cuentas</button><button :class="{active:homeTab==='movimientos'}" @click="homeTab='movimientos'">Historial</button></div><template v-if="homeTab==='movimientos'"><div class="transaction-list"><button class="transaction" v-for="t in transactions.filter(t=>t.account===activeAccount).slice(0,4)" @click="openReceipt(t)"><span class="transaction-icon" :class="{incoming:t.amount>0}"><icon :name="t.amount>0?'receive':t.kind==='qr'?'qr':'send'"></icon></span><span class="transaction-info"><strong>{{t.title}}</strong><small>{{t.date}} · {{t.category}}</small></span><span class="transaction-amount" :class="{positive:t.amount>0}">{{t.amount>0?'+':'−'}}{{money(Math.abs(t.amount))}}<small>Gs.</small></span></button></div><button class="text-link all-movements" @click="go('movimientos')">Ver todos los movimientos <span>↗</span></button></template><template v-else><div class="accounts-grid"><button class="account-pane" :class="{selected:i===activeAccount}" v-for="(a,i) in accounts" @click="activeAccount=i" :aria-label="a.type+' '+a.number+' '+money(a.balance)+' Gs.'" :aria-pressed="i===activeAccount"><div class="account-pane-top"><strong>{{profile.name}}</strong><span class="account-type">{{a.type}}<small>{{a.number}}</small></span></div><div class="account-pane-bottom"><span class="account-amount">{{balanceVisible?money(a.balance):'••••••'}} <small v-if="balanceVisible">Gs.</small></span><span class="account-status" :class="{inactive:a.status!=='Activa'}">{{i===activeAccount?'✓ ':''}}{{a.status}}</span></div></button></div></template>
</section></template>
<template v-else-if="page==='enviar'"><page-title title="Enviar dinero" @back="go('inicio')"></page-title><div class="stepper"><span :class="{done:transferStep>=1}">1 · Destino</span><i></i><span :class="{done:transferStep>=2}">2 · Importe</span><i></i><span :class="{done:transferStep>=3}">3 · Confirmar</span></div><form @submit.prevent="advanceTransfer"><template v-if="transferStep===1"><label>Banco destino<select v-model="transfer.bank"><option>SUDAMERIS</option><option>Banco 2</option><option>Banco 3</option><option>Banco 4</option></select></label><label>Alias o número de cuenta<input required v-model="transfer.destination" placeholder="Ej. lucia.bogado" @input="transfer.name=''"></label><h3 class="minor-title">Contactos frecuentes</h3><div class="contacts"><button type="button" v-for="c in contacts" @click="transfer.bank='SUDAMERIS';transfer.destination=c.alias;transfer.name=c.name"><span class="avatar">{{c.name.split(' ').map(s=>s[0]).slice(0,2).join('')}}</span><strong>{{c.name.split(' ')[0]}}</strong><small>{{c.alias}}</small></button></div></template><template v-if="transferStep===2"><div class="recipient-preview"><span class="avatar">{{transfer.name.slice(0,1)}}</span><div><small>Vas a enviar a</small><strong>{{transfer.name}}</strong><small>{{transfer.bank}} · {{transfer.destination}}</small></div></div><label>Desde tu cuenta<select v-model="activeAccount"><option v-for="(a,i) in accounts" :value="i">{{a.type}} · {{a.number.slice(-4)}}</option></select></label><label>Importe en guaraníes<input class="amount-input" type="number" required min="1" max="10000000" step="1" v-model="transfer.amount" placeholder="0"></label><small class="muted">Disponible: {{money(account.balance)}} Gs. · Máximo: 10.000.000 Gs.</small><label>Concepto <small>(opcional)</small><input v-model="transfer.concept" maxlength="80" placeholder="¿Para qué es este envío?"></label></template><template v-if="transferStep===3"><div class="review-amount"><small>VAS A ENVIAR</small><h2>{{money(Number(transfer.amount))}} <small>Gs.</small></h2><p>a {{transfer.name}}</p></div><div class="details"><div><span>Destino</span><strong>{{transfer.bank}}</strong></div><div><span>Alias / cuenta</span><strong>{{transfer.destination}}</strong></div><div><span>Cuenta de origen</span><strong>•••• {{account.number.slice(-4)}}</strong></div><div><span>Concepto</span><strong>{{transfer.concept||'Transferencia'}}</strong></div><div><span>Comisión</span><strong>Sin costo</strong></div></div></template><p class="error" v-if="transferError">{{transferError}}</p><button class="primary full" :disabled="busy">{{busy?'Procesando…':transferStep===3?'Confirmar envío':'Continuar'}} <span>→</span></button><button v-if="transferStep>1" type="button" class="secondary full" @click="transferStep--;transferError=''">Volver</button></form></template>
<template v-else-if="page==='recibir'"><page-title title="Recibir dinero" @back="go('inicio')"></page-title><section class="receive-card"><span class="avatar large">{{initials}}</span><h3>{{profile.name}}</h3><p class="muted">{{account.type}}</p><div class="qr-box" aria-label="Código QR de tu cuenta"><svg v-bind="{viewBox: '0 0 '+qrSize+' '+qrSize}"><rect :width="qrSize" :height="qrSize" fill="white"/><path :d="qrPath" fill="#073d32"/></svg></div><div class="alias">{{accountAlias}}</div><button class="text-link" @click="copy(accountAlias)">Copiar alias <icon name="copy"></icon></button></section><div class="details"><div><span>Banco</span><strong>SUDAMERIS</strong></div><div><span>Cuenta</span><strong>{{account.number}}</strong></div><div><span>Moneda</span><strong>Guaraníes · PYG</strong></div></div><button class="primary full" @click="shareAccount">Compartir mis datos ↗</button></template>
<template v-else-if="page==='movimientos'"><page-title title="Movimientos" @back="go('inicio')"></page-title><label class="search"><icon name="search"></icon><input v-model="search" placeholder="Buscar movimiento"></label><div class="filter-chips"><button v-for="f in ['Todos','Ingresos','Egresos']" :class="{selected:filter===f}" @click="filter=f">{{f}}</button><button @click="exportHistory">↓ Exportar</button></div><p class="muted small">{{filteredTransactions.length}} movimientos · {{account.type}}</p><button class="transaction" v-for="t in filteredTransactions" @click="openReceipt(t)"><span class="transaction-icon" :class="{incoming:t.amount>0}"><icon :name="t.amount>0?'receive':t.kind==='qr'?'qr':'send'"></icon></span><span class="transaction-info"><strong>{{t.title}}</strong><small>{{t.date}} · {{t.status}}</small></span><span class="transaction-amount" :class="{positive:t.amount>0}">{{t.amount>0?'+':'−'}}{{money(Math.abs(t.amount))}}<small>Gs.</small></span></button><div v-if="!filteredTransactions.length" class="empty">No encontramos movimientos.<p>Probá con otra búsqueda.</p></div></template>
<template v-else-if="page==='perfil'"><page-title title="Mi perfil" @back="go('inicio')"></page-title><div class="profile-hero"><span class="avatar large">{{initials}}</span><h3>{{profile.name}}</h3></div><form @submit.prevent="saveProfile"><label>Nombre y apellido<input v-model="profile.name" required></label><label>Correo electrónico<input type="email" v-model="profile.email" required></label><label>Celular<input type="tel" v-model="profile.phone" required></label><label>Alias<input v-model="profile.alias" required pattern="[A-Za-z0-9._-]{3,30}"></label><label>Documento<input :value="profile.document" disabled></label><button class="primary full">Guardar cambios <span>✓</span></button></form></template>
<template v-else-if="page==='opciones'"><page-title title="Opciones" @back="go('inicio')"></page-title><button class="profile-link" @click="go('perfil')"><span class="avatar">{{initials}}</span><span><strong>{{profile.name}}</strong><small>Ver y editar mi perfil</small></span><span>↗</span></button><button class="menu-item" v-for="m in menu" @click="go(m.page)"><span class="transaction-icon"><icon :name="m.icon"></icon></span><span><strong>{{m.title}}</strong></span><span>›</span></button><button class="logout" @click="modal='logout'">Cerrar sesión <span>↗</span></button></template>
<template v-else-if="page==='tarjetas'"><page-title title="Mis tarjetas" @back="go('opciones')"></page-title><div class="debit-card" :class="{frozen:cardFrozen}"><div><strong>SUDAMERIS</strong><span>DÉBITO</span></div><span class="chip">▥</span><h2>•••• &nbsp; •••• &nbsp; •••• &nbsp; 4821</h2><div><span>{{profile.name.toUpperCase()}}</span><span>12/29</span></div></div><div class="status-label">{{cardFrozen?'◉ Tarjeta pausada':'● Tarjeta activa'}}</div><button class="menu-item" @click="cardFrozen=!cardFrozen;persist();notify(cardFrozen?'Tarjeta pausada':'Tarjeta activada')"><icon name="shield"></icon><span><strong>{{cardFrozen?'Activar tarjeta':'Pausar tarjeta'}}</strong><small>{{cardFrozen?'Permití operaciones nuevamente':'Bloqueo temporal de tu tarjeta'}}</small></span><span class="toggle" :class="{on:!cardFrozen}"></span></button><div class="details"><div><span>Límite por retiro ATM</span><strong>1.500.000 Gs.</strong></div><div><span>Límite diario combinado</span><strong>10.000.000 Gs.</strong></div></div></template>
<template v-else-if="page==='ajustes'"><page-title title="Seguridad y ajustes" @back="go('opciones')"></page-title><button class="menu-item" @click="modal='password'"><icon name="shield"></icon><span><strong>Cambiar contraseña</strong><small>Actualizá tu contraseña</small></span><span>›</span></button><button class="menu-item" @click="settings.notifications=!settings.notifications;persist()"><icon name="bell"></icon><span><strong>Avisos de movimientos</strong><small>Avisos sobre la actividad de tu cuenta</small></span><span class="toggle" :class="{on:settings.notifications}"></span></button><button class="menu-item" @click="balanceVisible=!balanceVisible"><icon name="eye"></icon><span><strong>Mostrar saldo</strong><small>Elegí cómo se ve tu inicio</small></span><span class="toggle" :class="{on:balanceVisible}"></span></button></template>
<template v-else-if="page==='notificaciones'"><page-title title="Notificaciones" @back="go('inicio')"></page-title><button class="text-link" @click="unread=false;notify('Notificaciones marcadas como leídas')">Marcar todas como leídas</button><div class="notice" v-for="n in notices"><span class="transaction-icon"><icon name="bell"></icon></span><div><strong>{{n.title}}</strong><p>{{n.text}}</p><small>{{n.date}}</small></div></div></template>
<template v-else-if="page==='ayuda'"><page-title title="Ayuda" @back="go('opciones')"></page-title><details v-for="q in faqs"><summary>{{q.q}}</summary><p>{{q.a}}</p></details><form class="support-form" @submit.prevent="saveSupport"><h3>Dejanos tu consulta</h3><label>Motivo<select v-model="support.subject"><option>Transferencias</option><option>Acceso a mi cuenta</option><option>Tarjetas</option><option>Otro</option></select></label><label>Mensaje<textarea v-model="support.message" required minlength="10" placeholder="Contanos qué pasó…"></textarea></label><button class="primary full">Enviar consulta →</button><p v-if="supportSent" class="positive">Tu consulta quedó guardada en este dispositivo. Podés continuar navegando.</p></form></template>
<template v-else-if="page==='qr'"><page-title title="Pagar con QR" @back="go('inicio')"></page-title><div class="scanner"><span class="scan-corner"></span><icon name="qr"></icon><div class="scan-line"></div><p>Ingresá el código del comercio</p></div><form @submit.prevent="readPaymentCode"><label>Código de pago<input v-model="paymentCode" required placeholder="Ingresá el código del comercio"></label><p v-if="paymentError" class="error">{{paymentError}}</p><button class="primary full">Continuar con el pago →</button></form><button class="secondary full" @click="go('recibir')">Mostrar mi QR para recibir</button></template>
<template v-else-if="page==='comprobante' && receipt"><div class="receipt-head"><span class="success-icon">{{receipt.status==='Pendiente'?'◷':'✓'}}</span><span class="eyebrow">{{receipt.status==='Pendiente'?'OPERACIÓN EN REVISIÓN':'TODO LISTO'}}</span><h2>{{receipt.status==='Pendiente'?'Transferencia pendiente':receipt.amount>0?'Dinero recibido':'Operación realizada'}}</h2><p class="muted">{{receipt.status==='Pendiente'?'Esperamos la confirmación del banco destino.':''}}</p><h1>{{money(Math.abs(receipt.amount))}} <small>Gs.</small></h1></div><div class="details"><div><span>{{receipt.amount>0?'De':'Para'}}</span><strong>{{receipt.title}}</strong></div><div><span>Concepto</span><strong>{{receipt.category}}</strong></div><div><span>Estado</span><strong class="positive">{{receipt.status}}</strong></div><div><span>Fecha</span><strong>{{receipt.date}}</strong></div><div><span>Operación</span><strong>{{receipt.id}}</strong></div><div><span>Cuenta</span><strong>{{accounts[receipt.account].number}}</strong></div></div><button class="primary full" @click="downloadReceipt">Descargar comprobante ↓</button><button class="secondary full" @click="go('inicio')">Volver al inicio</button></template>
</div><nav class="bottom-nav"><button :class="{active:page==='perfil'}" @click="go('perfil')"><span class="nav-icon"><icon name="user"></icon></span><span>Perfil</span></button><button :class="{active:page==='inicio'}" @click="go('inicio')"><span class="nav-icon"><icon name="home"></icon></span><span>Inicio</span></button><button :class="{active:page==='opciones'}" @click="go('opciones')"><span class="nav-icon"><icon name="menu"></icon></span><span>Opciones</span></button></nav></template>
<div class="toast" role="status" v-if="toast">✓ {{toast}}</div><div class="modal-backdrop" v-if="modal" @click.self="modal=''"><section class="modal" role="dialog" aria-modal="true" :aria-label="modal==='accounts'?'Elegir cuenta':'Información'"><button class="close-modal" @click="modal=''" aria-label="Cerrar">×</button><template v-if="modal==='accounts'"><h2>Elegí tu cuenta</h2><button class="account-item" v-for="(a,i) in accounts" @click="activeAccount=i;modal='' "><span><strong>{{a.type}}</strong><small>{{a.number}} · {{a.status}}</small></span><strong>{{money(a.balance)}} Gs.</strong></button></template><template v-else-if="modal==='password'"><h2>Cambiar contraseña</h2><form @submit.prevent="changePassword"><label>Contraseña actual<input type="password" v-model="passwords.current" required></label><label>Nueva contraseña<input type="password" v-model="passwords.next" minlength="8" required></label><label>Repetir nueva contraseña<input type="password" v-model="passwords.confirm" minlength="8" required></label><p class="error">{{passwordError}}</p><button class="primary full">Guardar contraseña</button></form></template><template v-else-if="modal==='logout'"><h2>¿Cerrar tu sesión?</h2><p>Podés volver a ingresar cuando quieras.</p><button class="primary full" @click="logout()">Cerrar sesión</button><button class="secondary full" @click="modal=''">Seguir acá</button></template><template v-else><h2>SUDAMERIS</h2><p>esta vez, funcional.</p><button class="primary full" @click="modal=''">Cerrar</button></template></section></div>
</main></div><script src="bank.js?v=3"></script><script src="app.js?v=3"></script></body></html>
