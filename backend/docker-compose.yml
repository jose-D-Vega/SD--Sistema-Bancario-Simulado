services:
  cockroachdb:
    image: cockroachdb/cockroach:v23.2.8
    container_name: sudameris-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257" # puerto SQL
      - "8090:8080"   # UI web de administración (http://localhost:8090)
    volumes:
      - cockroach-data:/cockroach/cockroach-data

volumes:
  cockroach-data:
